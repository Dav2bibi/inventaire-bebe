<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventaire bébé partagé</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      margin: 14px;
      color: #263238;
      background: #fbf8f2;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 23px;
    }

    p {
      margin: 6px 0;
      color: #546e7a;
      font-size: 14px;
    }

    #statut {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .ok { color: #397568; }
    .attente { color: #8a6a45; }

    .table-wrap {
      overflow-x: auto;
      background: #fffdf9;
      border-radius: 12px;
      box-shadow: 0 3px 14px rgba(38, 50, 56, 0.08);
      -webkit-overflow-scrolling: touch;
    }

    table {
      border-collapse: collapse;
      width: max-content;
      min-width: 100%;
      table-layout: fixed;
      font-size: 12px;
    }

    th,
    td {
      width: 88px;
      min-width: 88px;
      max-width: 88px;
      padding: 5px 2px;
      border: 1px solid #e3e8e7;
      text-align: center;
      vertical-align: middle;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #e4f0ec;
      color: #365750;
      line-height: 1.2;
    }

    .age {
      display: block;
      font-weight: bold;
    }

    .taille-cm {
      display: block;
      margin-top: 3px;
      color: #617a75;
      font-size: 11px;
      font-weight: normal;
    }

    th:first-child,
    td:first-child {
      position: sticky;
      left: 0;
      z-index: 1;
      width: 120px;
      min-width: 120px;
      max-width: 120px;
      background: #f8f5ee;
      text-align: left;
      font-weight: bold;
      line-height: 1.2;
    }

    th:first-child {
      z-index: 3;
      background: #e4f0ec;
    }

    .counter {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      white-space: nowrap;
    }

    .counter button {
      appearance: none;
      -webkit-appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 28px;
      width: 28px;
      height: 28px;
      aspect-ratio: 1 / 1;
      padding: 0;
      border: none;
      border-radius: 50%;
      font-family: Arial, sans-serif;
      font-size: 19px;
      font-weight: bold;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .minus {
      background: #f8dede;
      color: #9b4b57;
      box-shadow: 0 2px 5px rgba(155, 75, 87, 0.16);
    }

    .minus:active {
      background: #efc7ca;
      transform: scale(0.94);
    }

    .plus {
      background: #d8eee6;
      color: #397566;
      box-shadow: 0 2px 5px rgba(57, 117, 102, 0.16);
    }

    .plus:active {
      background: #c2e3d7;
      transform: scale(0.94);
    }

    .number {
      min-width: 13px;
      font-size: 15px;
      font-weight: bold;
      color: #334541;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .actions button {
      padding: 10px 12px;
      border: 0;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(38, 50, 56, 0.10);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .actions button:active {
      transform: scale(0.97);
      filter: brightness(0.96);
    }

    #partager {
      background: #dfe5f7;
      color: #4d5d94;
    }

    #excel {
      background: #dceee4;
      color: #43795a;
    }

    #pdf {
      background: #dcefeb;
      color: #397568;
    }

    #reset {
      background: #f2e6e4;
      color: #8b5a55;
    }

    @media print {
      body { margin: 0; background: white; }
      h1 { font-size: 18px; }
      p, #statut, .actions { display: none; }
      .table-wrap { overflow: visible; box-shadow: none; }
      table { width: 100%; font-size: 8px; }
      th, td { width: auto; min-width: 0; max-width: none; padding: 3px; }
      .counter button { display: none; }
      .counter { display: block; }
      .number { font-size: 10px; }
      th:first-child, td:first-child {
        position: static;
        width: auto;
        min-width: 0;
        max-width: none;
      }
    }
  </style>
</head>

<body>
  <h1>Inventaire bébé partagé</h1>
  <p>Clique sur <strong>+</strong> ou <strong>−</strong>. Les changements sont synchronisés automatiquement.</p>
  <p id="statut" class="attente">Connexion à l’inventaire…</p>

  <div class="table-wrap">
    <table id="inventaire"></table>
  </div>

  <div class="actions">
    <button id="partager">Copier le lien</button>
    <button id="excel">Exporter Excel</button>
    <button id="pdf">Exporter PDF</button>
    <button id="reset">Réinitialiser</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import {
      getFirestore, doc, setDoc, onSnapshot, runTransaction
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBADIYuD9CRnfuiTjmQAxUKc5aKr_qQ8-Q",
      authDomain: "habitsbebe-3ad97.firebaseapp.com",
      projectId: "habitsbebe-3ad97",
      storageBucket: "habitsbebe-3ad97.firebasestorage.app",
      messagingSenderId: "1015119277918",
      appId: "1:1015119277918:web:068a345261aa701d50e9cf"
    };

    const tailles = [
      { age: "0 mois", taille: "50 cm" },
      { age: "1 mois", taille: "54 cm" },
      { age: "2 mois", taille: "60 cm" },
      { age: "3 mois", taille: "60 cm" },
      { age: "6 mois", taille: "67 cm" },
      { age: "9 mois", taille: "71 cm" },
      { age: "12 mois", taille: "74 cm" },
      { age: "18 mois", taille: "81 cm" },
      { age: "24 mois", taille: "86 cm" },
      { age: "3 ans", taille: "94 cm" }
    ];

    const articles = [
      "Bodies manches courtes",
      "Bodies manches longues",
      "Pyjamas légers",
      "Pyjamas épais",
      "Grenouillères",
      "Pantalons / leggings",
      "Shorts",
      "Hauts / pulls",
      "Gilets",
      "Salopettes",
      "Combinaisons",
      "Vestes / manteaux",
      "Chaussettes / chaussons",
      "Bonnets",
      "Lolettes",
      "Biberons",
      "Gigoteuses",
      "Autres"
    ];

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const table = document.getElementById("inventaire");
    const statut = document.getElementById("statut");

    let donnees = {};
    let inventaireRef;

    const url = new URL(window.location.href);
    let listeId = url.searchParams.get("liste");

    if (!listeId) {
      listeId = crypto.getRandomValues(new Uint32Array(4)).join("");
      url.searchParams.set("liste", listeId);
      window.history.replaceState({}, "", url);
    }

    function creerTableau() {
      let html = "<thead><tr><th>Type d’article</th>";

      tailles.forEach(taille => {
        html += `<th>
          <span class="age">${taille.age}</span>
          <span class="taille-cm">${taille.taille}</span>
        </th>`;
      });

      html += "</tr></thead><tbody>";

      articles.forEach((article, ligne) => {
        html += `<tr><td>${article}</td>`;

        tailles.forEach((taille, colonne) => {
          const id = `${ligne}-${colonne}`;
          const nombre = donnees[id] || 0;

          html += `
            <td>
              <div class="counter">
                <button class="minus" data-id="${id}" data-change="-1" aria-label="Retirer un article">−</button>
                <span class="number">${nombre}</span>
                <button class="plus" data-id="${id}" data-change="1" aria-label="Ajouter un article">+</button>
              </div>
            </td>`;
        });

        html += "</tr>";
      });

      table.innerHTML = html + "</tbody>";

      table.querySelectorAll("button[data-id]").forEach(bouton => {
        bouton.addEventListener("click", () => {
          modifier(bouton.dataset.id, Number(bouton.dataset.change));
        });
      });
    }

    async function modifier(id, changement) {
      try {
        await runTransaction(db, async transaction => {
          const snapshot = await transaction.get(inventaireRef);
          const quantites = snapshot.exists()
            ? (snapshot.data().quantites || {})
            : {};

          quantites[id] = Math.max(0, (quantites[id] || 0) + changement);
          transaction.set(inventaireRef, { quantites }, { merge: true });
        });
      } catch (erreur) {
        alert("La modification n’a pas pu être enregistrée. Vérifie votre connexion Internet.");
      }
    }

    async function demarrer() {
      await signInAnonymously(auth);
      inventaireRef = doc(db, "inventaires", listeId);

      onSnapshot(
        inventaireRef,
        async snapshot => {
          if (!snapshot.exists()) {
            await setDoc(inventaireRef, {
              quantites: {},
              creeLe: new Date().toISOString()
            });
            return;
          }

          donnees = snapshot.data().quantites || {};
          creerTableau();
          statut.textContent = "● Inventaire synchronisé";
          statut.className = "ok";
        },
        () => {
          statut.textContent = "● Synchronisation indisponible";
          statut.className = "attente";
        }
      );
    }

    document.getElementById("partager").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(window.location.href);
        alert("Le lien a été copié. Tu peux maintenant l’envoyer à ta copine.");
      } catch {
        prompt("Copie ce lien et envoie-le à ta copine :", window.location.href);
      }
    });

    document.getElementById("pdf").addEventListener("click", () => {
      window.print();
    });

    document.getElementById("excel").addEventListener("click", () => {
      const tableau = table.cloneNode(true);
      tableau.querySelectorAll("button").forEach(bouton => bouton.remove());

      tableau.querySelectorAll(".counter").forEach(compteur => {
        compteur.innerHTML = compteur.querySelector(".number").textContent;
      });

      const contenu = `
        <html>
          <head>
            <meta charset="UTF-8">
            <style>
              table { border-collapse: collapse; }
              th, td { border: 1px solid #999; padding: 6px; text-align: center; }
              th { background: #dff3f0; }
              td:first-child { text-align: left; font-weight: bold; }
            </style>
          </head>
          <body>
            <h1>Inventaire bébé</h1>
            ${tableau.outerHTML}
          </body>
        </html>`;

      const fichier = new Blob(["\ufeff", contenu], {
        type: "application/vnd.ms-excel;charset=utf-8"
      });

      const lien = document.createElement("a");
      lien.href = URL.createObjectURL(fichier);
      lien.download = "inventaire-bebe.xls";
      document.body.appendChild(lien);
      lien.click();
      document.body.removeChild(lien);
      URL.revokeObjectURL(lien.href);
    });

    document.getElementById("reset").addEventListener("click", async () => {
      if (confirm("Effacer toutes les quantités pour vous deux ?")) {
        await setDoc(inventaireRef, { quantites: {} }, { merge: true });
      }
    });

    demarrer().catch(() => {
      statut.textContent = "● Vérifie la configuration Firebase";
      statut.className = "attente";
    });
  </script>
</body>
</html>
